[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "citizenofthecloud-crewai"
version = "0.1.0"
description = "CrewAI integration for Citizen of the Cloud identity protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Citizen of the Cloud", email = "hello@citizenofthecloud.com"},
]
keywords = ["crewai", "ai-agents", "identity", "verification", "trust", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "citizenofthecloud>=0.1.0",
    "crewai>=0.50.0",
    "requests>=2.28.0",
    "structlog>=23.0.0",
]

[project.urls]
Homepage = "https://citizenofthecloud.com"
Documentation = "https://citizenofthecloud.com/docs"
Repository = "https://github.com/citizenofthecloud/crewai"
Issues = "https://github.com/citizenofthecloud/crewai/issues"

[tool.setuptools.packages.find]
include = ["citizenofthecloud_crewai*"]
